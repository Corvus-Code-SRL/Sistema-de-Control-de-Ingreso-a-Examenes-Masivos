ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/sciem/backend/public
    DirectoryIndex index.html index.php

    <Directory /var/www/sciem/backend/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # Laravel ya declara el prefijo /api. Se conserva en la URL solicitada.
        RewriteRule ^api(?:/|$) index.php [END]

        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [END]

        # React Router: al recargar una ruta interna, servir el punto de entrada.
        RewriteRule ^ index.html [END]
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
