# Procesos de Apache + PHP. mod_php usa prefork: cada proceso atiende una petición a la vez.
#
# El valor por defecto de Debian (MaxRequestWorkers 150) es demasiado para SCIEM: cada proceso puede
# abrir su propia conexión a PostgreSQL, y 150 supera max_connections (100). Con un pico de peticiones,
# la base empezaría a rechazar conexiones («too many clients») y cada proceso consume 30–60 MB de RAM.
#
# Cálculo para SCIEM: un ingreso masivo (~1.500 postulantes, ~20 pantallas consultando cada 5 s) son unas
# 10 peticiones por segundo de pocos milisegundos; 30 procesos sobran y dejan conexiones libres para el
# scheduler, los respaldos y una consola de administración. Si se ven peticiones en espera, subirlo de a
# poco, siempre por debajo de max_connections.

<IfModule mpm_prefork_module>
    StartServers              5
    MinSpareServers           5
    MaxSpareServers          10
    MaxRequestWorkers        30
    MaxConnectionsPerChild 1000
</IfModule>
