; Límites de subida de archivos de SCIEM.
;
; La nómina de estudiantes (HU-021) admite hasta 10 MB y así lo valida
; PreviewStudentRosterRequest. Con los valores por defecto de PHP (2M y 8M) un archivo
; de entre 2 y 10 MB se descarta antes de llegar a Laravel y el docente recibe el
; mensaje equivocado, el de nómina no seleccionada. El margen por encima de los 10 MB
; deja que sea el validador de la aplicación el que rechace los archivos demasiado
; grandes, con su propio mensaje; post_max_size va por encima de upload_max_filesize
; para dar espacio al resto del cuerpo multipart.

upload_max_filesize = 12M
post_max_size = 16M
